{% extends "base.html" %}
{% block title %}Erro {{ codigo }}{% endblock %}
{% block header %}Erro {{ codigo }}{% endblock %}
{% block content %}
<div class="card animate-fade p-5 text-center">
  <i class="bi bi-exclamation-triangle-fill text-warning" style="font-size:3rem"></i>
  <h3 class="mt-3">Erro {{ codigo }}</h3>
  <p class="text-muted">{{ mensagem }}</p>
  <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary">Voltar ao início</a>
</div>
{% endblock %}
{% block login_content %}
<div class="login-container"><div class="login-card text-center">
  <h3>Erro {{ codigo }}</h3><p>{{ mensagem }}</p>
</div></div>
{% endblock %}
